name: Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  backend-checks:
    name: Backend Linting & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: "ci-testing-jwt-secret-key-32-chars-long-123456"
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/test_db"
      REDIS_URL: "redis://localhost:6379/0"
      GEMINI_API_KEY: "dummy-key-for-ci-tests"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m prisma generate
          python -m prisma db push --accept-data-loss

      - name: Lint Backend with Ruff
        run: |
          cd backend
          python -m ruff check .

      - name: Verify Backend Application & Router Compilation
        run: |
          cd backend
          python -c "from app.main import app; print('✅ FastAPI Application and all Routers Loaded Successfully')"

      - name: Run Backend Integration & Verification Tests
        run: |
          cd backend
          python scripts/test_changes.py

  frontend-checks:
    name: Frontend TypeScript & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Type Check & Production Build
        run: |
          cd frontend
          npm run type-check
          npm run build
