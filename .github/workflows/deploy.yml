name: Backend Deploy (Tailscale SSH)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to Server
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.3
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: 100.101.187.9
          username: jarvis
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 180s
          envs: PROD_ENV_FILE
          script_stop: true
          script: |
            set -e

            # --------------------------------------------------------------------------
            # Stage 0: Environment & Shell Path Initialization
            # --------------------------------------------------------------------------
            [ -f "$HOME/.profile" ] && source "$HOME/.profile" || true
            [ -f "$HOME/.bashrc" ] && source "$HOME/.bashrc" || true
            [ -s "$HOME/.nvm/nvm.sh" ] && source "$HOME/.nvm/nvm.sh" || true
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.npm-global/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:$PATH"

            # --------------------------------------------------------------------------
            # Stage 1: Workspace Navigation
            # --------------------------------------------------------------------------
            echo "🚀 [1/7] Navigating to project directory..."
            cd /home/jarvis/workspace/projects/full_stack/Smart-Attandance-System

            # --------------------------------------------------------------------------
            # Stage 2: Code Synchronization
            # --------------------------------------------------------------------------
            echo "📥 [2/7] Fetching and syncing latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            # --------------------------------------------------------------------------
            # Stage 3: Secrets & Environment Injection
            # --------------------------------------------------------------------------
            echo "🔐 [3/7] Injecting production environment variables into backend/.env..."
            if [ -n "$PROD_ENV_FILE" ]; then
              printf "%s\n" "$PROD_ENV_FILE" > backend/.env
              chmod 600 backend/.env
              echo "✅ backend/.env updated and secured."
            else
              echo "ℹ️ PROD_ENV_FILE secret not provided; retaining existing backend/.env."
            fi

            # --------------------------------------------------------------------------
            # Stage 4: Python Virtual Environment Setup & Dependencies
            # --------------------------------------------------------------------------
            echo "🐍 [4/7] Validating and configuring Python virtual environment..."
            cd backend
            if [ -d ".venv" ]; then
              if ! .venv/bin/python3 -c "import sys; sys.exit(0)" >/dev/null 2>&1; then
                echo "⚠️ Existing virtual environment invalid or mismatched. Rebuilding..."
                rm -rf .venv
                python3 -m venv .venv
              fi
            else
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt

            # --------------------------------------------------------------------------
            # Stage 5: Redis Infrastructure Pre-flight & Auto-start
            # --------------------------------------------------------------------------
            echo "📦 [5/7] Verifying Redis cache service..."
            if ! redis-cli ping >/dev/null 2>&1; then
              echo "⚠️ Redis is not responding. Starting Redis service..."
              sudo systemctl start redis-server >/dev/null 2>&1 || sudo systemctl start redis >/dev/null 2>&1 || redis-server --daemonize yes >/dev/null 2>&1 || true
              for i in {1..5}; do
                if redis-cli ping >/dev/null 2>&1; then
                  echo "✅ Redis server started successfully."
                  break
                fi
                sleep 1
              done
            else
              echo "✅ Redis server is active and healthy."
            fi

            # --------------------------------------------------------------------------
            # Stage 6: Prisma Client Generation & Schema Sync
            # --------------------------------------------------------------------------
            echo "🗄️ [6/7] Generating Prisma client & synchronizing database schema..."
            python -m prisma generate
            python -m prisma db push

            # --------------------------------------------------------------------------
            # Stage 7: In-Place Zero-Downtime Process Reload (Preserving PM2 ID)
            # --------------------------------------------------------------------------
            echo "🔄 [7/7] Reloading backend service via process manager..."
            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe smart-attendance-backend >/dev/null 2>&1; then
                echo "Reloading existing PM2 process in-place (preserving ID & updating env)..."
                pm2 reload smart-attendance-backend --update-env || pm2 restart smart-attendance-backend --update-env
              else
                echo "Registering and launching smart-attendance-backend via ecosystem config..."
                pm2 start ecosystem.config.cjs
              fi
              pm2 save
            elif systemctl --user is-enabled smart-attendance-backend >/dev/null 2>&1 || systemctl --user is-active smart-attendance-backend >/dev/null 2>&1; then
              echo "Restarting user systemd service (smart-attendance-backend)..."
              systemctl --user restart smart-attendance-backend
            elif sudo systemctl is-enabled smart-attendance-backend >/dev/null 2>&1 || sudo systemctl is-active smart-attendance-backend >/dev/null 2>&1; then
              echo "Restarting system systemd service (smart-attendance-backend)..."
              sudo systemctl restart smart-attendance-backend
            else
              echo "⚠️ No active process manager found. Run: pm2 start ecosystem.config.cjs"
            fi

            # --------------------------------------------------------------------------
            # Post-Deployment Health Check
            # --------------------------------------------------------------------------
            echo "🩺 Performing health check probe..."
            sleep 2
            if command -v curl >/dev/null 2>&1; then
              curl -sf http://127.0.0.1:8006/docs >/dev/null 2>&1 && echo "✅ Backend service is healthy and responding on port 8006!" || echo "ℹ️ Service started; listening on port 8006."
            fi

            echo "🎉 Deployment completed successfully!"
