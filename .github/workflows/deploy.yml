name: Backend Deploy (Tailscale SSH)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to Server
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.3
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: 100.101.187.9
          username: jarvis
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          envs: PROD_ENV_FILE
          script_stop: true
          script: |
            set -e
            echo "🚀 [1/6] Navigating to project directory..."
            cd /home/jarvis/workspace/projects/full_stack/Smart-Attandance-System

            echo "📥 [2/6] Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔐 [3/6] Injecting production environment variables into backend/.env..."
            if [ -n "$PROD_ENV_FILE" ]; then
              printf "%s\n" "$PROD_ENV_FILE" > backend/.env
              chmod 600 backend/.env
            else
              echo "⚠️ PROD_ENV_FILE secret is empty; keeping existing backend/.env"
            fi

            echo "🐍 [4/6] Setting up backend Python virtual environment..."
            cd backend
            if [ -d ".venv" ]; then
              # Recreate venv if corrupted, broken, or created against a different python version
              if ! .venv/bin/python3 -c "import sys; sys.exit(0)" >/dev/null 2>&1; then
                echo "⚠️ Existing virtual environment is invalid or mismatched. Recreating..."
                rm -rf .venv
                python3 -m venv .venv
              fi
            else
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt

            echo "🗄️ [5/6] Generating Prisma client & synchronizing schema..."
            python -m prisma generate
            python -m prisma db push

            echo "🔄 [6/6] Restarting backend service..."
            export PATH="$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:~/.npm-global/bin"

            if command -v pm2 >/dev/null 2>&1; then
              echo "Starting/Reloading PM2 service (smart-attendance-backend)..."
              pm2 delete smart-attendance-backend >/dev/null 2>&1 || true
              pm2 start ecosystem.config.cjs --update-env
              pm2 save
            elif systemctl --user is-enabled smart-attendance-backend >/dev/null 2>&1 || systemctl --user is-active smart-attendance-backend >/dev/null 2>&1; then
              echo "Restarting user systemd service (smart-attendance-backend)..."
              systemctl --user restart smart-attendance-backend
            elif sudo systemctl is-enabled smart-attendance-backend >/dev/null 2>&1 || sudo systemctl is-active smart-attendance-backend >/dev/null 2>&1; then
              echo "Restarting system systemd service (smart-attendance-backend)..."
              sudo systemctl restart smart-attendance-backend
            else
              echo "⚠️ No active process manager (PM2/systemd) found. Please run: pm2 start .venv/bin/uvicorn --name smart-attendance-backend -- main:app --host 0.0.0.0 --port 8006"
            fi

            echo "✅ Deployment completed successfully!"
