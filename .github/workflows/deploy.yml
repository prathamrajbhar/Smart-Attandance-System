name: Backend Deploy (Tailscale SSH)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to Server
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: 100.101.187.9
          username: jarvis
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          script_stop: true
          script: |
            set -e
            echo "🚀 [1/5] Navigating to project directory..."
            cd /home/jarvis/workspace/projects/full_stack/Smart-Attandance-System

            echo "📥 [2/5] Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐍 [3/5] Setting up backend Python virtual environment..."
            cd backend
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt

            echo "🗄️ [4/5] Generating Prisma client & synchronizing schema..."
            python -m prisma generate
            python -m prisma db push

            echo "🔄 [5/5] Restarting backend service..."
            if systemctl --user is-enabled smart-attendance-backend >/dev/null 2>&1 || systemctl --user is-active smart-attendance-backend >/dev/null 2>&1; then
              echo "Restarting user systemd service (smart-attendance-backend)..."
              systemctl --user restart smart-attendance-backend
            elif sudo systemctl is-enabled smart-attendance-backend >/dev/null 2>&1 || sudo systemctl is-active smart-attendance-backend >/dev/null 2>&1; then
              echo "Restarting system systemd service (smart-attendance-backend)..."
              sudo systemctl restart smart-attendance-backend
            elif command -v pm2 >/dev/null 2>&1 && pm2 list | grep -q "smart-attendance-backend"; then
              echo "Restarting PM2 process (smart-attendance-backend)..."
              pm2 restart smart-attendance-backend --update-env
            else
              echo "⚠️ No active systemd service or PM2 process found matching 'smart-attendance-backend'."
              echo "Please ensure your process manager unit (systemd/PM2) is configured and running."
            fi

            echo "✅ Deployment completed successfully!"
