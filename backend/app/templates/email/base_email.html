<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ subject }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #334155;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }
    table {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    .email-wrapper {
      width: 100%;
      background-color: #f8fafc;
      padding: 40px 16px;
      box-sizing: border-box;
    }
    .email-container {
      max-width: 560px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }
    .email-header {
      padding: 24px 32px;
      border-bottom: 1px solid #f1f5f9;
      background-color: #ffffff;
    }
    .brand-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .email-body {
      padding: 32px;
      font-size: 14px;
      line-height: 1.6;
      color: #334155;
    }
    .email-heading {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .btn-container {
      margin: 24px 0;
    }
    .btn-primary {
      display: inline-block;
      padding: 11px 22px;
      background-color: #0f172a;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      border-radius: 6px;
      text-align: center;
    }
    .data-table {
      width: 100%;
      margin: 20px 0;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      font-size: 13px;
    }
    .data-table td {
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
    }
    .data-table tr:last-child td {
      border-bottom: none;
    }
    .data-label {
      width: 38%;
      color: #64748b;
      font-weight: 500;
      background-color: #f8fafc;
    }
    .data-value {
      color: #0f172a;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-pending {
      background-color: #fef3c7;
      color: #92400e;
    }
    .badge-approved {
      background-color: #dcfce7;
      color: #166534;
    }
    .badge-rejected {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .email-footer {
      padding: 20px 32px;
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      line-height: 1.5;
      color: #64748b;
    }
    .fallback-link {
      font-size: 12px;
      color: #64748b;
      word-break: break-all;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
    }
    .fallback-link a {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-container">
      <div class="email-header">
        <h1 class="brand-title">{{ system_name }}</h1>
      </div>
      <div class="email-body">
        {% block content %}{% endblock %}
      </div>
      <div class="email-footer">
        <p style="margin: 0 0 4px 0;">This is an automated administrative notification. Please do not reply directly to this email.</p>
        <p style="margin: 0;">Smart Attendance System • Institutional Security Infrastructure</p>
      </div>
    </div>
  </div>
</body>
</html>
